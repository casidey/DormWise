{% extends "app_base.html" %}
{% block title %}Edit expense | DormWise{% endblock %}
{% block content %}
<h1 class="page-title" data-rise>Edit expense</h1>
<form method="post" novalidate class="card card-pop flex max-w-[520px] flex-col gap-[18px]" data-rise>
  {% csrf_token %}
  {% include "core/_expense_fields.html" %}
  <div class="flex flex-wrap gap-3">
    <button class="btn btn-primary btn-pop">Save changes</button>
    <a href="{% url 'expenses' %}" class="btn">Cancel</a>
  </div>
</form>
{% endblock %}
