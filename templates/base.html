{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>{% block title %}DormWise{% endblock %}</title>
  <meta name="description" content="{% block meta_description %}DormWise turns your allowance into a daily spending limit, rebuilds it when you overspend, and splits dorm bills with your roommates.{% endblock %}">
  <link rel="icon" type="image/svg+xml" href="{% static 'img/favicon.svg' %}">
  <link rel="preload" href="{% static 'fonts/bricolage-grotesque-latin-wght-normal.woff2' %}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{% static 'css/output.css' %}">
  <script src="{% static 'vendor/gsap.min.js' %}" defer></script>
  <script src="{% static 'vendor/ScrollTrigger.min.js' %}" defer></script>
  <script src="{% static 'js/app.js' %}" defer></script>
</head>
<body class="antialiased">
  <a class="skip-link" href="#main">Skip to content</a>
  {% block body %}{% endblock %}
</body>
</html>
